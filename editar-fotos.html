<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, follow">
<link rel="canonical" href="https://semeiabr.com/editar-fotos"><title>Editar fotos — Semeia</title>
<link rel="icon" href="assets/semeia-mark.svg" type="image/svg+xml"><link rel="stylesheet" href="assets/style.css?v=20260816-voltar"><style>
.editor{max-width:820px;padding-block:3.5rem 5rem}.editor-head{display:flex;align-items:center;justify-content:space-between;gap:1rem;margin-bottom:1.4rem}.editor-head h1{font-size:clamp(2.5rem,7vw,4.2rem);margin:.5rem 0}.back{white-space:nowrap}.panel{padding:clamp(1.25rem,4vw,2rem);border:1px solid var(--line);border-radius:26px;background:color-mix(in srgb,var(--card) 95%,transparent)}.help{margin:0 0 1.2rem;color:var(--ink-soft)}.photos{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.8rem}.photo{position:relative;overflow:hidden;aspect-ratio:1;border:1px solid var(--line);border-radius:18px;background:var(--paper)}.photo img{width:100%;height:100%;display:block;object-fit:cover}.photo-actions{position:absolute;left:.5rem;right:.5rem;bottom:.5rem;display:flex;gap:.4rem}.photo-actions button{flex:1;min-width:0;padding:.5rem .4rem;border:0;border-radius:10px;background:rgba(8,20,12,.84);color:#fff;font:700 .65rem ui-sans-serif,system-ui,sans-serif;cursor:pointer}.cover{position:absolute;left:.55rem;top:.55rem;padding:.35rem .5rem;border-radius:999px;background:var(--accent);color:#102016;font:700 .6rem ui-sans-serif,system-ui,sans-serif}.picker{display:flex;align-items:center;justify-content:center;min-height:8rem;margin-top:1rem;border:1px dashed var(--accent);border-radius:18px;color:var(--accent);font-weight:700;cursor:pointer;background:color-mix(in srgb,var(--accent) 5%,transparent)}.file{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}.footer{display:flex;align-items:center;justify-content:space-between;gap:1rem;margin-top:1.2rem}.status{color:var(--ink-soft);font-size:.8rem}.loading{text-align:center;padding:3rem;color:var(--ink-soft)}@media(max-width:620px){.editor-head,.footer{align-items:stretch;flex-direction:column}.photos{grid-template-columns:repeat(2,minmax(0,1fr))}.back,.footer .btn{width:100%;justify-content:center;box-sizing:border-box}}
</style></head><body><header class="site-nav"><div class="inner"><a class="brand" href="index.html"><img class="brand-mark" src="assets/semeia-mark.svg" alt="">Semeia</a><nav><a href="minha-loja.html">Minha loja</a></nav></div></header><main class="wrap editor"><div class="editor-head"><div><span class="eyebrow">Galeria do anúncio</span><h1>Editar fotos</h1><p id="product-name"></p></div><a class="btn btn-ghost back" href="minha-loja.html">← Voltar</a></div><section class="panel"><div id="loading" class="loading">Carregando suas fotos…</div><div id="content" hidden><p class="help">Adicione, remova ou escolha a capa. Mantenha entre 1 e 5 fotos.</p><div class="photos" id="photos"></div><input class="file" id="files" type="file" accept="image/jpeg,image/png,image/webp" multiple><label class="picker" for="files" id="picker">＋ Adicionar fotos</label><div class="semeia-security"><span>Proteção para edição de fotos</span><div class="cf-turnstile" data-sitekey="0x4AAAAAAENPXnq4jBtZ6CA3" data-action="turnstile-spin-v1" data-theme="dark"></div></div><div class="footer"><span class="status" id="status">A primeira imagem será a capa do anúncio.</span><button class="btn btn-primary" id="save" type="button">Salvar fotos</button></div></div></section></main><script src="assets/config.js?v=20260813-api-url"></script><script src="assets/notice.js?v=20260813-1"></script><script src="assets/security.js"></script><script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script><script>window.SemeiaFirebaseReady=import("./assets/firebase-auth.js");</script><script>
(async()=>{const A=SEMEIA_API_URL.replace(/\/$/,''),id=new URLSearchParams(location.search).get('id'),MAX=5,TYPES=['image/jpeg','image/png','image/webp'],MAX_SIZE=6*1024*1024,photos=[],E=q=>document.querySelector(q);let auth;
async function credentials(){sessionStorage.removeItem('semeia-store-login');const firebase=await window.SemeiaFirebaseReady,token=await firebase.restoreIdToken();return token?{idToken:token}:null}
function render(){E('#photos').innerHTML='';photos.forEach((item,index)=>{const box=document.createElement('div'),img=document.createElement('img'),actions=document.createElement('div'),cover=document.createElement('button'),remove=document.createElement('button');box.className='photo';img.src=item.preview||item.url;img.alt='Foto '+(index+1);actions.className='photo-actions';cover.type=remove.type='button';cover.textContent=index===0?'Capa atual':'Tornar capa';cover.onclick=()=>{photos.unshift(photos.splice(index,1)[0]);render()};remove.textContent='Remover';remove.onclick=()=>{if(photos.length===1)return SemeiaNotice.alert('O anúncio precisa manter pelo menos uma foto.');photos.splice(index,1);render()};actions.append(cover,remove);box.append(img,actions);if(index===0){const badge=document.createElement('span');badge.className='cover';badge.textContent='Capa';box.appendChild(badge)}E('#photos').appendChild(box)});E('#picker').hidden=photos.length>=MAX;E('#status').textContent=photos.length+' / '+MAX+' fotos · a primeira será a capa.'}
function compress(file){return new Promise((resolve,reject)=>{const image=new Image(),url=URL.createObjectURL(file);image.onload=()=>{URL.revokeObjectURL(url);const scale=Math.min(1,1600/Math.max(image.naturalWidth,image.naturalHeight)),canvas=document.createElement('canvas');canvas.width=Math.round(image.naturalWidth*scale);canvas.height=Math.round(image.naturalHeight*scale);canvas.getContext('2d').drawImage(image,0,0,canvas.width,canvas.height);canvas.toBlob(blob=>blob?resolve(blob):reject(Error('Falha ao preparar uma foto.')),'image/jpeg',.82)};image.onerror=()=>reject(Error('Não foi possível ler uma foto.'));image.src=url})}
async function upload(file){const blob=await compress(file),form=new FormData();form.append('file',blob,'produto-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,8)+'.jpg');form.append('kind','product');const response=await fetch(A+'/api/store/upload',{method:'POST',headers:{authorization:'Bearer '+auth.idToken},body:form}),data=await response.json();if(!response.ok)throw Error(data.error||'Falha ao enviar foto.');return data.url}
E('#files').onchange=()=>{for(const file of Array.from(E('#files').files||[])){if(photos.length>=MAX){SemeiaNotice.alert('Limite de 5 fotos atingido.');break}if(!TYPES.includes(file.type)){SemeiaNotice.alert('Use JPG, PNG ou WebP.');continue}if(file.size>MAX_SIZE){SemeiaNotice.alert(file.name+' ultrapassa 6 MB.');continue}photos.push({file,preview:URL.createObjectURL(file)})}E('#files').value='';render()};
E('#save').onclick=async()=>{const button=E('#save');button.disabled=true;button.textContent='Salvando…';try{await SemeiaSecurity.verify(document);const urls=[];for(const item of photos)urls.push(item.url||await upload(item.file));const response=await fetch(A+'/api/store-products/'+encodeURIComponent(id)+'/images',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({...auth,imageUrls:urls})}),data=await response.json();if(!response.ok)throw Error(data.error);location.href='produto.html?id='+encodeURIComponent(id)}catch(error){SemeiaNotice.alert(error.message);if(window.turnstile)window.turnstile.reset()}finally{button.disabled=false;button.textContent='Salvar fotos'}};
try{auth=await credentials();if(!auth)throw Error('Entre na sua loja para editar as fotos.');const response=await fetch(A+'/api/store/me',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(auth)}),data=await response.json();if(!response.ok)throw Error(data.error);const product=data.products.find(item=>item.id===id);if(!product)throw Error('Este produto não pertence à sua loja.');E('#product-name').textContent=product.name;(product.imageUrls?.length?product.imageUrls:product.imageUrl?[product.imageUrl]:[]).forEach(url=>photos.push({url}));render();E('#loading').hidden=true;E('#content').hidden=false}catch(error){E('#loading').textContent=error.message+' Volte para Minha loja e faça login.'}
})();
</script><script src="assets/main.js?v=20260816-volta-produto"></script></body></html>
